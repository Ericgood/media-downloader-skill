[project]
name = "media-downloader-skill"
version = "0.1.0"
description = "A verified public-media downloader bundled as a Codex Skill"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
